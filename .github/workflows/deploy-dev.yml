name: Deploy Dev
on:
  push:
    branches: ["develop"]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: true

# Vercel Globber 팀의 globber-client-dev 프로젝트 (식별자라서 비밀 값이 아님)
env:
  VERCEL_ORG_ID: team_PaeV7e9HYV7jfApBj8h7hkbs
  VERCEL_PROJECT_ID: prj_tPl54imUQw9tNnmoog5mliS4Tegc

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@58.4.4

      # Hobby 플랜의 Git 연동은 커밋 작성자가 계정 소유자가 아니면 배포를 막기 때문에,
      # 글로버 계정 토큰으로 CLI 배포를 요청하고 빌드는 Vercel에서 수행한다.
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          url=$(vercel deploy --prod --yes --token="$VERCEL_TOKEN" \
            --build-env NEXT_PUBLIC_GOOGLE_MAPS_API_KEY="$GOOGLE_MAPS_API_KEY" \
            --env GOOGLE_MAPS_API_KEY="$GOOGLE_MAPS_API_KEY" \
            --meta githubCommitSha="$GITHUB_SHA" \
            --meta githubCommitRef="$GITHUB_REF_NAME" \
            --meta githubCommitMessage="$(printf '%s' "$COMMIT_MESSAGE" | head -n 1)" \
            --meta githubCommitAuthorLogin="$GITHUB_ACTOR" \
            --meta githubRepo="${GITHUB_REPOSITORY#*/}" \
            --meta githubOrg="$GITHUB_REPOSITORY_OWNER")
          echo "Deployed: $url"
          echo "### Vercel 개발 서버 배포 완료" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
